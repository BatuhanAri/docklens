[project]
name = "docklens"
version = "0.1.0"
description = "Analyze docker-compose files and generate a best-practice & risk report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Batuhan Ari" }]
dependencies = ["pyyaml>=6.0", "typer>=0.12", "rich>=13.0"]

[project.scripts]
docklens = "docklens.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"

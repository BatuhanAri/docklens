name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest
